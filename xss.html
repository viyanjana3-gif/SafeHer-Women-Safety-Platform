<html lang="en">
<head>

    <title>SafeHer - XSS Protection</title>
</head>
<body>

    <h2>SafeHer - User Safety Information</h2>

    <div id="root"></div>

    <script>
        const userInput = '<img src=x onerror=alert("Hacked")>';

        // Unsafe approach (XSS vulnerability)
        // document.getElementById("root").innerHTML = userInput;

        // Safe approach (XSS protection)
        document.getElementById("root").textContent = userInput;
    </script>

</body>
